services:
  # Almacén S3-compatible para el media de WhatsApp (audios, imágenes, videos).
  # En producción este servicio desaparece y las variables S3_* apuntan a Backblaze B2,
  # que expone la misma API S3. El bridge no cambia.
  minio:
    # Opcional: en dev se reutiliza el MinIO que ya corre en el host (SunTalk/minio).
    # Para usar este: docker compose --profile local-minio up
    profiles: ["local-minio"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      # 9000: API S3 (la usa el bridge para subir y el agente para descargar).
      - "${MINIO_API_PORT:-9000}:9000"
      # 9001: consola web, útil para ver los archivos subidos durante las pruebas.
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  whatsapp-bridge:
    build: .
    restart: unless-stopped
    volumes:
      - wa_auth:/app/.wwebjs_auth
      - wa_cache:/app/.wwebjs_cache
    # En Linux `host.docker.internal` no existe por defecto: este mapeo lo hace resolver
    # al host, que es donde suele correr la FastAPI del agente durante las pruebas.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CHROME_EXECUTABLE_PATH: /usr/bin/chromium
      CHATSUNTALK_API_URL: ${CHATSUNTALK_API_URL:-http://host.docker.internal:8000}
      CHATSUNTALK_API_PATH: ${CHATSUNTALK_API_PATH:-/v3/chatsuntalk/whatsapp}
      CHATSUNTALK_API_KEY: ${CHATSUNTALK_API_KEY:-}
      CHATSUNTALK_API_TIMEOUT_MS: ${CHATSUNTALK_API_TIMEOUT_MS:-120000}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}

      # Endpoint interno: por dónde SUBE el bridge (red de docker).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # Endpoint público: con el que se FIRMA la URL que descargará el agente. Debe ser
      # resoluble DESDE EL AGENTE. Con el agente corriendo en el host, localhost:9000
      # (puerto publicado arriba). Si el agente pasa a correr en docker en esta misma
      # red, cámbialo a http://minio:9000.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-whatsapp-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ENSURE_BUCKET: ${S3_ENSURE_BUCKET:-true}
      MEDIA_URL_TTL: ${MEDIA_URL_TTL:-3600}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-20971520}

volumes:
  wa_auth:
  wa_cache:
  minio_data:
